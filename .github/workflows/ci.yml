name: C# CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, analyze and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Find C# projects
        shell: bash
        run: |
          find lab1 -type f -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' | sort > projects.txt

          if [ ! -s projects.txt ]; then
            echo "::error::No .csproj files found"
            exit 1
          fi

          : > tests.txt
          : > apps.txt
          while IFS= read -r project; do
            if grep -qE "Microsoft.NET.Test.Sdk|MSTest" "$project"; then
              echo "$project" >> tests.txt
            else
              echo "$project" >> apps.txt
            fi
          done < projects.txt

          echo "Test projects:"; cat tests.txt
          echo "App projects:"; cat apps.txt

          if [ ! -s tests.txt ]; then
            echo "::error::No test projects found"
            exit 1
          fi
          if [ ! -s apps.txt ]; then
            echo "::error::No app projects found"
            exit 1
          fi

      - name: Restore all projects
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < projects.txt

      - name: Run tests and check coverage threshold
        shell: bash
        run: |
          threshold=90
          failed=0

          while IFS= read -r project; do
            name=$(basename "$project" .csproj)
            outdir="./TestResults/$name"
            echo "Testing $project ($name)"

            dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --collect:"XPlat Code Coverage" \
              --results-directory "$outdir" < /dev/null || failed=1

            file=$(find "$outdir" -name coverage.cobertura.xml | head -n 1)
            if [ -z "$file" ]; then
              echo "::error::No coverage file for $name"
              failed=1
              continue
            fi

            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$file" | head -n 1 | cut -d'"' -f2)
            percent=$(awk -v r="$rate" 'BEGIN { printf "%.2f", r * 100 }')
            echo "Line coverage for $name: $percent% (required: $threshold%)"

            if awk -v p="$percent" -v t="$threshold" 'BEGIN { exit !(p < t) }'; then
              echo "::error::Coverage of $name is $percent%, below $threshold%"
              failed=1
            fi
          done < tests.txt

          exit "$failed"

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if ! find TestResults -name coverage.cobertura.xml 2>/dev/null | grep -q .; then
            echo "No coverage files, skipping report"
            exit 0
          fi
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-*_Tests"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check code formatting
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Checking formatting: $project"
            dotnet format whitespace "$project" \
              --verify-no-changes \
              --verbosity diagnostic
          done < projects.txt

      - name: Run static analysis
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Analyzing: $project"
            dotnet format analyzers "$project" \
              --verify-no-changes \
              --no-restore \
              --severity error \
              --verbosity diagnostic
          done < projects.txt

      - name: Build all projects
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet build "$project" \
              --configuration Release \
              --no-restore
          done < projects.txt

      - name: Publish applications
        shell: bash
        run: |
          while IFS= read -r project; do
            name=$(basename "$project" .csproj)
            echo "Publishing $name"
            dotnet publish "$project" \
              --configuration Release \
              --runtime win-x64 \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output "./artifacts/$name"
          done < apps.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labs-build
          path: artifacts/
          if-no-files-found: error

      - name: Upload coverage xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Upload coverage html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: CoverageReport/
          if-no-files-found: warn

  docs:
    name: Build and deploy documentation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Restore projects
        shell: bash
        run: |
          find lab1 -type f -name '*.csproj' \
            -not -path '*/bin/*' -not -path '*/obj/*' | while IFS= read -r project; do
            dotnet restore "$project"
          done

      - name: Build documentation site
        shell: bash
        run: |
          dotnet tool install --global docfx
          docfx docfx.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: labs-build
          path: artifacts/

      - name: Verify executables
        shell: bash
        run: |
          find artifacts -type f -name '*.exe'
          count=$(find artifacts -type f -name '*.exe' | wc -l)
          test "$count" -ge 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true