name: C# CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, analyze and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Find C# projects
        shell: bash
        run: |
          find lab1 lab2 -type f -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' -not -path '*/.vs/*' | sort > projects.txt

          if [ ! -s projects.txt ]; then
            echo "::error::No .csproj files found"
            exit 1
          fi

          : > tests.txt
          : > apps.txt

          while IFS= read -r project; do
            if grep -qiE 'Microsoft[.]NET[.]Test[.]Sdk|Microsoft[.]Testing[.]Platform|xunit|MSTest|NUnit|TestingPlatformDotnetTestSupport|UseMicrosoftTestingPlatformRunner|IsTestProject' "$project"; then
              echo "$project" >> tests.txt
            else
              echo "$project" >> apps.txt
            fi
          done < projects.txt

          echo "Test projects:"
          cat tests.txt

          echo "Application projects:"
          cat apps.txt

          if [ ! -s tests.txt ]; then
            echo "::error::No test projects found"
            exit 1
          fi

          if [ ! -s apps.txt ]; then
            echo "::error::No application projects found"
            exit 1
          fi

      # =====================================================
      # RESTORE
      # =====================================================

      - name: Restore all projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Restoring $project"
            dotnet restore "$project"
          done < projects.txt

      - name: Run tests and check coverage threshold
        shell: bash
        run: |
          threshold=90
          failed=0

          mkdir -p TestResults

          while IFS= read -r project; do
            project_dir=$(dirname "$project")
            project_file=$(basename "$project")

            name="${project%.csproj}"
            safe_name=$(echo "$name" | tr '/ ' '__')

            outdir="$GITHUB_WORKSPACE/TestResults/$safe_name"

            mkdir -p "$outdir"

            echo "========================================"
            echo "Testing: $project"
            echo "========================================"

            # Detect Microsoft Testing Platform.
            mtp=false

            if grep -qiE \
              'Microsoft\.Testing\.Platform|xunit\.v3\.mtp|UseMicrosoftTestingPlatformRunner|TestingPlatformDotnetTestSupport' \
              "$project"; then
              mtp=true
            else
              # Also check global.json in the project directory
              # and all its parent directories.
              search_dir="$project_dir"

              while true; do
                if [ -f "$search_dir/global.json" ] &&
                   grep -qE \
                     '"runner"[[:space:]]*:[[:space:]]*"Microsoft\.Testing\.Platform"' \
                     "$search_dir/global.json"; then
                  mtp=true
                  break
                fi

                if [ "$search_dir" = "." ] ||
                   [ "$search_dir" = "$GITHUB_WORKSPACE" ]; then
                  break
                fi

                parent_dir=$(dirname "$search_dir")

                if [ "$parent_dir" = "$search_dir" ]; then
                  break
                fi

                search_dir="$parent_dir"
              done
            fi

            # Run MTP or VSTest depending on the project.
            if [ "$mtp" = true ]; then
              echo "Test runner: Microsoft Testing Platform"

              (
                cd "$project_dir"

                dotnet test \
                  --project "./$project_file" \
                  --configuration Release \
                  --no-restore \
                  --results-directory "$outdir" \
                  --coverlet \
                  --coverlet-output-format cobertura
              ) || failed=1

            else
              echo "Test runner: VSTest"

              (
                cd "$project_dir"

                dotnet test "./$project_file" \
                  --configuration Release \
                  --no-restore \
                  --collect:"XPlat Code Coverage" \
                  --results-directory "$outdir"
              ) || failed=1
            fi

            # Find Cobertura report from either runner.
            file=$(find "$outdir" -type f \
              \( -name 'coverage.cobertura.xml' \
              -o -name 'coverage.cobertura.*.xml' \) \
              -print -quit)

            if [ -z "$file" ]; then
              echo "::error::No coverage file found for $project"
              failed=1
              continue
            fi

            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$file" \
              | cut -d'"' -f2)

            if [ -z "$rate" ]; then
              echo "::error::Cannot read coverage rate for $project"
              failed=1
              continue
            fi

            percent=$(awk -v r="$rate" \
              'BEGIN { printf "%.2f", r * 100 }')

            echo "Line coverage: $percent%"
            echo "Required coverage: $threshold%"

            if awk -v p="$percent" -v t="$threshold" \
              'BEGIN { exit !(p < t) }'; then
              echo "::error::Coverage of $project is $percent%, below $threshold%"
              failed=1
            fi

          done < tests.txt

          exit "$failed"

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if ! find TestResults -type f \
            \( -name 'coverage.cobertura.xml' \
            -o -name 'coverage.cobertura.*.xml' \) \
            | grep -q .; then
            echo "No coverage files, skipping report"
            exit 0
          fi

          dotnet tool install --global dotnet-reportgenerator-globaltool

          export PATH="$PATH:$HOME/.dotnet/tools"

          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura*.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-*_Tests;-*.Tests"

          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check code formatting
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Checking formatting: $project"

            dotnet format whitespace "$project" \
              --verify-no-changes \
              --verbosity diagnostic

          done < projects.txt

      - name: Run static analysis
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Analyzing: $project"

            dotnet format analyzers "$project" \
              --verify-no-changes \
              --no-restore \
              --severity error \
              --verbosity diagnostic

          done < projects.txt

      - name: Build all projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Building: $project"

            dotnet build "$project" \
              --configuration Release \
              --no-restore

          done < projects.txt

      - name: Publish applications
        shell: bash
        run: |
          while IFS= read -r project; do
            name=$(basename "$project" .csproj)

            echo "Publishing $name"

            dotnet publish "$project" \
              --configuration Release \
              --runtime win-x64 \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output "./artifacts/$name"

          done < apps.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labs-build
          path: artifacts/
          if-no-files-found: error

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**/*.xml
          if-no-files-found: warn

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: CoverageReport/
          if-no-files-found: warn

  docs:
    name: Build and deploy documentation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Restore projects from both labs
        shell: bash
        run: |
          find lab1 lab2 -type f -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' | sort | while IFS= read -r project; do

            echo "Restoring: $project"
            dotnet restore "$project"

          done

      - name: Build documentation site
        shell: bash
        run: |
          dotnet tool install --global docfx
          export PATH="$PATH:$HOME/.dotnet/tools"

          docfx docfx.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')))

    needs: test-and-build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: labs-build
          path: artifacts/

      - name: Verify executables
        shell: bash
        run: |
          count=$(find artifacts -type f -name '*.exe' | wc -l)

          echo "Found executables: $count"

          if [ "$count" -lt 1 ]; then
            echo "::error::No executable files found"
            exit 1
          fi

      - name: Define tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*.exe
          generate_release_notes: true
