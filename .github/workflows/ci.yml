name: C# CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "lab1-v*"
      - "lab2-v*"
      - "lab3-v*"
      - "lab4-v*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # DETECT CHANGED LABS
  # =====================================================

  detect:
    name: Detect changed laboratories
    runs-on: ubuntu-latest

    outputs:
      labs: ${{ steps.detect.outputs.labs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect laboratories
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          labs=()

          # A release tag selects exactly one laboratory.
          if [[ "$GITHUB_REF" == refs/tags/lab1-v* ]]; then
            labs=("lab1")

          elif [[ "$GITHUB_REF" == refs/tags/lab2-v* ]]; then
            labs=("lab2")

          elif [[ "$GITHUB_REF" == refs/tags/lab3-v* ]]; then
            labs=("lab3")

          elif [[ "$GITHUB_REF" == refs/tags/lab4-v* ]]; then
            labs=("lab4")

          # Manual run builds all laboratories.
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            labs=("lab1" "lab2" "lab3" "lab4")

          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            else
              BASE_SHA="$BEFORE_SHA"
            fi

            # If the previous commit is unavailable,
            # build all laboratories to be safe.
            if [[ -z "$BASE_SHA" ]] ||
               [[ "$BASE_SHA" =~ ^0+$ ]] ||
               ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then

              echo "Base commit unavailable. Building all laboratories."
              labs=("lab1" "lab2" "lab3" "lab4")

            else
              echo "Changed files:"
              git diff --name-only "$BASE_SHA" "$HEAD_SHA"

              while IFS= read -r file; do
                case "$file" in
                  lab1/*)
                    if [[ ! " ${labs[*]} " =~ " lab1 " ]]; then
                      labs+=("lab1")
                    fi
                    ;;
                  lab2/*)
                    if [[ ! " ${labs[*]} " =~ " lab2 " ]]; then
                      labs+=("lab2")
                    fi
                    ;;
                  lab3/*)
                    if [[ ! " ${labs[*]} " =~ " lab3 " ]]; then
                      labs+=("lab3")
                    fi
                    ;;
                  lab4/*)
                    if [[ ! " ${labs[*]} " =~ " lab4 " ]]; then
                      labs+=("lab4")
                    fi
                    ;;
                esac
              done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            fi
          fi

          if [[ ${#labs[@]} -eq 0 ]]; then
            echo "No laboratory changes detected."
            echo 'labs=[]' >> "$GITHUB_OUTPUT"
          else
            json=$(printf '%s\n' "${labs[@]}" | jq -R . | jq -sc .)
            echo "Selected laboratories: $json"
            echo "labs=$json" >> "$GITHUB_OUTPUT"
          fi

  # =====================================================
  # TEST, ANALYZE, BUILD AND PUBLISH
  # =====================================================

  build:
    name: Build ${{ matrix.lab }}
    runs-on: ubuntu-latest

    needs: detect

    if: needs.detect.outputs.labs != '[]'

    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJSON(needs.detect.outputs.labs) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      # =================================================
      # FIND PROJECTS
      # =================================================

      - name: Find C# projects
        shell: bash
        env:
          LAB: ${{ matrix.lab }}
        run: |
          find "$LAB" \
            -type f \
            -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            -not -path '*/.vs/*' \
            | sort > projects.txt

          if [ ! -s projects.txt ]; then
            echo "::error::No C# projects found in $LAB"
            exit 1
          fi

          : > tests.txt
          : > apps.txt

          while IFS= read -r project; do
            if grep -qiE \
              'Microsoft[.]NET[.]Test[.]Sdk|Microsoft[.]Testing[.]Platform|xunit|MSTest|NUnit|TestingPlatformDotnetTestSupport|UseMicrosoftTestingPlatformRunner|IsTestProject' \
              "$project"; then

              echo "$project" >> tests.txt
            else
              echo "$project" >> apps.txt
            fi
          done < projects.txt

          echo "Projects:"
          cat projects.txt

          echo "Test projects:"
          cat tests.txt

          echo "Application projects:"
          cat apps.txt

          if [ ! -s tests.txt ]; then
            echo "::error::No test projects found in $LAB"
            exit 1
          fi

          if [ ! -s apps.txt ]; then
            echo "::error::No application projects found in $LAB"
            exit 1
          fi

      # =================================================
      # RESTORE
      # =================================================

      - name: Restore projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Restoring: $project"
            dotnet restore "$project"
          done < projects.txt

      # =================================================
      # TESTS AND COVERAGE
      # =================================================

      - name: Run tests and check coverage threshold
        shell: bash
        run: |
          threshold=90
          failed=0

          mkdir -p TestResults

          while IFS= read -r project; do
            project_dir=$(dirname "$project")
            project_file=$(basename "$project")

            name="${project%.csproj}"
            safe_name=$(echo "$name" | tr '/ ' '__')

            outdir="$GITHUB_WORKSPACE/TestResults/$safe_name"

            mkdir -p "$outdir"

            echo "========================================"
            echo "Testing: $project"
            echo "========================================"

            # Detect Microsoft Testing Platform.
            mtp=false

            if grep -qiE \
              'Microsoft\.Testing\.Platform|xunit\.v3\.mtp|UseMicrosoftTestingPlatformRunner|TestingPlatformDotnetTestSupport' \
              "$project"; then

              mtp=true
            else
              search_dir="$project_dir"

              while true; do
                if [ -f "$search_dir/global.json" ] &&
                   grep -qE \
                     '"runner"[[:space:]]*:[[:space:]]*"Microsoft\.Testing\.Platform"' \
                     "$search_dir/global.json"; then

                  mtp=true
                  break
                fi

                if [ "$search_dir" = "." ] ||
                   [ "$search_dir" = "$GITHUB_WORKSPACE" ]; then
                  break
                fi

                parent_dir=$(dirname "$search_dir")

                if [ "$parent_dir" = "$search_dir" ]; then
                  break
                fi

                search_dir="$parent_dir"
              done
            fi

            if [ "$mtp" = true ]; then
              echo "Test runner: Microsoft Testing Platform"

              (
                cd "$project_dir"

                dotnet test \
                  --project "./$project_file" \
                  --configuration Release \
                  --no-restore \
                  --results-directory "$outdir" \
                  --coverlet \
                  --coverlet-output-format cobertura
              ) || failed=1

            else
              echo "Test runner: VSTest"

              (
                cd "$project_dir"

                dotnet test "./$project_file" \
                  --configuration Release \
                  --no-restore \
                  --collect:"XPlat Code Coverage" \
                  --results-directory "$outdir"
              ) || failed=1
            fi

            # Find Cobertura report.
            file=$(find "$outdir" -type f \
              \( -name 'coverage.cobertura.xml' \
              -o -name 'coverage.cobertura.*.xml' \) \
              -print -quit)

            if [ -z "$file" ]; then
              echo "::error::No coverage file found for $project"
              failed=1
              continue
            fi

            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$file" \
              | cut -d'"' -f2)

            if [ -z "$rate" ]; then
              echo "::error::Cannot read coverage rate for $project"
              failed=1
              continue
            fi

            percent=$(awk -v r="$rate" \
              'BEGIN { printf "%.2f", r * 100 }')

            echo "Line coverage: $percent%"
            echo "Required coverage: $threshold%"

            if awk -v p="$percent" -v t="$threshold" \
              'BEGIN { exit !(p < t) }'; then

              echo "::error::Coverage of $project is $percent%, below $threshold%"
              failed=1
            fi

          done < tests.txt

          exit "$failed"

      # =================================================
      # COVERAGE REPORT
      # =================================================

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if ! find TestResults -type f \
            \( -name 'coverage.cobertura.xml' \
            -o -name 'coverage.cobertura.*.xml' \) \
            | grep -q .; then

            echo "No coverage files, skipping report"
            exit 0
          fi

          dotnet tool install --global dotnet-reportgenerator-globaltool

          export PATH="$PATH:$HOME/.dotnet/tools"

          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura*.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-*_Tests;-*.Tests"

          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # =================================================
      # FORMATTING
      # =================================================

      - name: Check code formatting
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Checking formatting: $project"

            dotnet format whitespace "$project" \
              --verify-no-changes \
              --verbosity diagnostic

          done < projects.txt

      # =================================================
      # STATIC ANALYSIS
      # =================================================

      - name: Run static analysis
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Analyzing: $project"

            dotnet format analyzers "$project" \
              --verify-no-changes \
              --no-restore \
              --severity error \
              --verbosity diagnostic

          done < projects.txt

      # =================================================
      # BUILD
      # =================================================

      - name: Build projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Building: $project"

            dotnet build "$project" \
              --configuration Release \
              --no-restore

          done < projects.txt

      # =================================================
      # PUBLISH
      # =================================================

      - name: Publish applications
        shell: bash
        env:
          LAB: ${{ matrix.lab }}
        run: |
          mkdir -p artifacts

          while IFS= read -r project; do
            name=$(basename "$project" .csproj)

            echo "Publishing $name"

            dotnet publish "$project" \
              --configuration Release \
              --runtime win-x64 \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output "./artifacts/$name"

          done < apps.txt

      # =================================================
      # PACKAGE CLEAN SOURCE ARCHIVE
      # =================================================

      - name: Create source archive
        shell: bash
        env:
          LAB: ${{ matrix.lab }}
        run: |
          if [ ! -d "$LAB" ]; then
            echo "::error::Laboratory directory $LAB does not exist"
            exit 1
          fi

          zip -r "artifacts/${LAB}-source.zip" "$LAB" \
            -x "*/bin/*" \
               "*/obj/*" \
               "*/.vs/*" \
               "*/.git/*" \
               "*/TestResults/*" \
               "*/CoverageReport/*"

          echo "Created source archive: artifacts/${LAB}-source.zip"

      # =================================================
      # UPLOAD ARTIFACTS
      # =================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-build
          path: artifacts/
          if-no-files-found: error

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-coverage
          path: TestResults/**/*.xml
          if-no-files-found: warn

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-coverage-html
          path: CoverageReport/
          if-no-files-found: warn

  # =====================================================
  # DOCUMENTATION
  # =====================================================

  docs:
    name: Build and deploy documentation

    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Restore projects from all labs
        shell: bash
        run: |
          find lab1 lab2 lab3 lab4 -type f -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            | sort | while IFS= read -r project; do

            echo "Restoring: $project"
            dotnet restore "$project"

          done

      - name: Build documentation site
        shell: bash
        run: |
          dotnet tool install --global docfx
          export PATH="$PATH:$HOME/.dotnet/tools"

          docfx docfx.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =====================================================
  # GITHUB RELEASE
  # =====================================================

  release:
    name: Publish ${{ startsWith(github.ref, 'refs/tags/lab1-') && 'Lab1' || startsWith(github.ref, 'refs/tags/lab2-') && 'Lab2' || startsWith(github.ref, 'refs/tags/lab3-') && 'Lab3' || 'Lab4' }} Release

    if: |
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/lab1-v') ||
       startsWith(github.ref, 'refs/tags/lab2-v') ||
       startsWith(github.ref, 'refs/tags/lab3-v') ||
       startsWith(github.ref, 'refs/tags/lab4-v'))

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/lab1-') && 'lab1-build' || startsWith(github.ref, 'refs/tags/lab2-') && 'lab2-build' || startsWith(github.ref, 'refs/tags/lab3-') && 'lab3-build' || 'lab4-build' }}
          path: artifacts/

      - name: Verify executables
        shell: bash
        run: |
          echo "Found executables:"

          find artifacts -type f -name '*.exe' -print

          count=$(find artifacts -type f -name '*.exe' | wc -l)
          source_archive=$(find artifacts -maxdepth 1 -type f \
            -name '*-source.zip' -print -quit)

          if [ "$count" -lt 1 ]; then
            echo "::error::No executable files found"
            exit 1
          fi

          if [ -z "$source_archive" ]; then
            echo "::error::Source archive not found"
            exit 1
          fi

          echo "Found source archive: $source_archive"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.exe
            artifacts/*-source.zip
          generate_release_notes: true
