
name: C# CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "lab1-v*"
      - "lab2-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, analyze and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      # =====================================================
      # SELECT LABORATORIES
      # =====================================================

      - name: Select laboratories
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/lab1-v* ]] ||
             [[ "$GITHUB_REF" == refs/heads/lab1 ]]; then
            echo "lab1" > labs.txt

          elif [[ "$GITHUB_REF" == refs/tags/lab2-v* ]] ||
               [[ "$GITHUB_REF" == refs/heads/lab2 ]]; then
            echo "lab2" > labs.txt

          else
            printf "lab1\nlab2\n" > labs.txt
          fi

          echo "Selected laboratories:"
          cat labs.txt

      # =====================================================
      # PROJECT DISCOVERY
      # =====================================================

      - name: Find C# projects
        shell: bash
        run: |
          : > projects.txt
          : > tests.txt
          : > apps.txt

          while IFS= read -r lab; do
            if [ ! -d "$lab" ]; then
              echo "::error::Directory $lab not found"
              exit 1
            fi

            find "$lab" -type f -name '*.csproj' \
              -not -path '*/bin/*' \
              -not -path '*/obj/*' \
              -not -path '*/.vs/*' \
              >> projects.txt

          done < labs.txt

          sort -o projects.txt projects.txt

          if [ ! -s projects.txt ]; then
            echo "::error::No .csproj files found"
            exit 1
          fi

          while IFS= read -r project; do
            if grep -qiE \
              'Microsoft[.]NET[.]Test[.]Sdk|Microsoft[.]Testing[.]Platform|xunit|MSTest|NUnit|TestingPlatformDotnetTestSupport|UseMicrosoftTestingPlatformRunner|IsTestProject' \
              "$project"; then
              echo "$project" >> tests.txt
            else
              echo "$project" >> apps.txt
            fi
          done < projects.txt

          echo "All projects:"
          cat projects.txt

          echo "Test projects:"
          cat tests.txt

          echo "Application projects:"
          cat apps.txt

          if [ ! -s tests.txt ]; then
            echo "::error::No test projects found"
            exit 1
          fi

          if [ ! -s apps.txt ]; then
            echo "::error::No application projects found"
            exit 1
          fi

      # =====================================================
      # RESTORE
      # =====================================================

      - name: Restore projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Restoring $project"
            dotnet restore "$project"
          done < projects.txt

      # =====================================================
      # TESTS AND COVERAGE
      # =====================================================

      - name: Run tests and check coverage threshold
        shell: bash
        run: |
          threshold=90
          failed=0

          mkdir -p TestResults

          while IFS= read -r project; do
            project_dir=$(dirname "$project")
            project_file=$(basename "$project")

            name="${project%.csproj}"
            safe_name=$(echo "$name" | tr '/ ' '__')

            outdir="$GITHUB_WORKSPACE/TestResults/$safe_name"
            mkdir -p "$outdir"

            echo "========================================"
            echo "Testing: $project"
            echo "========================================"

            # Detect Microsoft Testing Platform.
            mtp=false

            if grep -qiE \
              'Microsoft[.]Testing[.]Platform|xunit[.]v3[.]mtp|UseMicrosoftTestingPlatformRunner|TestingPlatformDotnetTestSupport' \
              "$project"; then
              mtp=true
            else
              search_dir="$project_dir"

              while true; do
                if [ -f "$search_dir/global.json" ] &&
                   grep -qE \
                     '"runner"[[:space:]]*:[[:space:]]*"Microsoft[.]Testing[.]Platform"' \
                     "$search_dir/global.json"; then
                  mtp=true
                  break
                fi

                if [ "$search_dir" = "." ] ||
                   [ "$search_dir" = "$GITHUB_WORKSPACE" ]; then
                  break
                fi

                parent_dir=$(dirname "$search_dir")

                if [ "$parent_dir" = "$search_dir" ]; then
                  break
                fi

                search_dir="$parent_dir"
              done
            fi

            if [ "$mtp" = true ]; then
              echo "Test runner: Microsoft Testing Platform"

              (
                cd "$project_dir"

                dotnet test \
                  --project "./$project_file" \
                  --configuration Release \
                  --no-restore \
                  --results-directory "$outdir" \
                  --coverlet \
                  --coverlet-output-format cobertura
              ) || failed=1

            else
              echo "Test runner: VSTest"

              (
                cd "$project_dir"

                dotnet test "./$project_file" \
                  --configuration Release \
                  --no-restore \
                  --collect:"XPlat Code Coverage" \
                  --results-directory "$outdir"
              ) || failed=1
            fi

            # Find Cobertura report.
            file=$(find "$outdir" -type f \
              \( -name 'coverage.cobertura.xml' \
              -o -name 'coverage.cobertura.*.xml' \) \
              -print -quit)

            if [ -z "$file" ]; then
              echo "::error::No coverage file found for $project"
              failed=1
              continue
            fi

            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$file" \
              | cut -d'"' -f2)

            if [ -z "$rate" ]; then
              echo "::error::Cannot read coverage rate for $project"
              failed=1
              continue
            fi

            percent=$(awk -v r="$rate" \
              'BEGIN { printf "%.2f", r * 100 }')

            echo "Line coverage: $percent%"
            echo "Required coverage: $threshold%"

            if awk -v p="$percent" -v t="$threshold" \
              'BEGIN { exit !(p < t) }'; then
              echo "::error::Coverage of $project is $percent%, below $threshold%"
              failed=1
            fi

          done < tests.txt

          exit "$failed"

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if ! find TestResults -type f \
            \( -name 'coverage.cobertura.xml' \
            -o -name 'coverage.cobertura.*.xml' \) \
            | grep -q .; then
            echo "No coverage files, skipping report"
            exit 0
          fi

          dotnet tool install --global dotnet-reportgenerator-globaltool

          export PATH="$PATH:$HOME/.dotnet/tools"

          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura*.xml" \
            -targetdir:CoverageReport \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-*_Tests;-*.Tests"

          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # FORMATTING
      # =====================================================

      - name: Check code formatting
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Checking formatting: $project"

            dotnet format whitespace "$project" \
              --verify-no-changes \
              --verbosity diagnostic

          done < projects.txt

      # =====================================================
      # STATIC ANALYSIS
      # =====================================================

      - name: Run static analysis
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Analyzing: $project"

            dotnet format analyzers "$project" \
              --verify-no-changes \
              --no-restore \
              --severity error \
              --verbosity diagnostic

          done < projects.txt

      # =====================================================
      # BUILD
      # =====================================================

      - name: Build projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Building: $project"

            dotnet build "$project" \
              --configuration Release \
              --no-restore

          done < projects.txt

      # =====================================================
      # PUBLISH
      # =====================================================

      - name: Publish applications
        shell: bash
        run: |
          while IFS= read -r project; do
            lab=$(echo "$project" | cut -d'/' -f1)
            name=$(basename "$project" .csproj)

            echo "Publishing $lab / $name"

            dotnet publish "$project" \
              --configuration Release \
              --runtime win-x64 \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              --output "./artifacts/$lab/$name"

          done < apps.txt

      # =====================================================
      # RELEASE PACKAGES
      # =====================================================

      - name: Prepare release packages
        if: startsWith(github.ref, 'refs/tags/lab1-v') || startsWith(github.ref, 'refs/tags/lab2-v')
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/lab1-v* ]]; then
            lab="lab1"
          elif [[ "$GITHUB_REF" == refs/tags/lab2-v* ]]; then
            lab="lab2"
          else
            echo "::error::Unknown release tag"
            exit 1
          fi

          mkdir -p release-assets

          echo "Preparing release for $lab"

          # Source code of the selected laboratory only.
          git archive \
            --format=zip \
            --output="release-assets/${lab}-source.zip" \
            HEAD "$lab"

          # Published Windows applications of the selected laboratory.
          if [ ! -d "artifacts/$lab" ]; then
            echo "::error::No published artifacts found for $lab"
            exit 1
          fi

          (
            cd artifacts
            zip -qr "../release-assets/${lab}-win-x64.zip" "$lab"
          )

          echo "Release files:"
          ls -lh release-assets

      # =====================================================
      # ARTIFACTS
      # =====================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: labs-build
          path: artifacts/
          if-no-files-found: error

      - name: Upload release packages
        if: startsWith(github.ref, 'refs/tags/lab1-v') || startsWith(github.ref, 'refs/tags/lab2-v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: TestResults/**/*.xml
          if-no-files-found: warn

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: CoverageReport/
          if-no-files-found: warn

  # =======================================================
  # DOCUMENTATION
  # =======================================================

  docs:
    name: Build and deploy documentation
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Restore projects
        shell: bash
        run: |
          find lab1 lab2 -type f -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            | sort | while IFS= read -r project; do

            echo "Restoring: $project"
            dotnet restore "$project"

          done

      - name: Build documentation site
        shell: bash
        run: |
          dotnet tool install --global docfx
          export PATH="$PATH:$HOME/.dotnet/tools"

          docfx docfx.json

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =======================================================
  # RELEASE
  # =======================================================

  release:
    name: Publish laboratory release

    if: |
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/lab1-v') ||
       startsWith(github.ref, 'refs/tags/lab2-v'))

    needs: test-and-build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Verify release packages
        shell: bash
        run: |
          echo "Release assets:"
          ls -lh release-assets

          count=$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)

          if [ "$count" -lt 2 ]; then
            echo "::error::Expected source and published ZIP archives"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-assets/*.zip
          generate_release_notes: true
